<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarjeta de Identificación con Barra Escáner</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: white;
  }

  .card {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: white;
    text-align: center;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  .top {
    width: 100%;
  }

  .logo {
    padding: clamp(20px, 5vh, 40px) 0 clamp(14px, 3vh, 24px);
  }

  .logo img {
    width: clamp(70px, 22vw, 110px);
  }

  .name-section {
    background-color: #b8d432;
    color: #e0670f;
    padding: clamp(16px, 4vh, 26px) clamp(14px, 5vw, 24px);
    width: 100%;
  }

  .name-section p {
    margin: clamp(4px, 1vh, 8px) 0;
    font-weight: bold;
    font-size: clamp(17px, 5.5vw, 26px);
    line-height: 1.2;
  }

  .name-section p.code {
    font-size: clamp(26px, 8.5vw, 42px);
    margin-top: clamp(10px, 2vh, 16px);
  }

  .photo {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(14px, 3vh, 28px) 0;
  }

  .photo img {
    width: clamp(190px, 60vw, 340px);
    height: auto;
    border-radius: 8px;
  }

  .bottom {
    width: 100%;
    padding-bottom: clamp(20px, 4vh, 40px);
  }

  .role {
    color: #e0670f;
    font-weight: bold;
    font-size: clamp(20px, 6.5vw, 32px);
    margin-bottom: clamp(16px, 3vh, 28px);
  }

  .barcode {
    padding: 0 clamp(20px, 8vw, 44px);
  }

  .barcode img {
    width: 100%;
    max-width: 560px;
  }

  /* Barra Escáner */
  .barra-escaner {
    width: 100%;
    height: 14px;
    background: linear-gradient(to bottom, #f79052, #d9791e);
    position: absolute;
    top: 0;
    left: 0;
    z-index: 9999;
    animation: escanear 2.9s linear infinite;
  }

  @keyframes escanear {
    0% {
      top: 0;
    }
    50% {
      top: calc(100% - 14px);
    }
    100% {
      top: 0;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="barra-escaner"></div>
    <div class="top">
      <div class="logo">
        <img src="assets/logo.jpg" alt="Logo Universidad de Lima">
      </div>
      <div class="name-section">
        <p>FACUNDO DAVILA ANDY</p>
        <p>SAHID HEBER</p>
        <p class="code">20224753</p>
      </div>
    </div>
    <div class="photo">
      <img src="assets/photo.jpg" alt="Foto del alumno">
    </div>
    <div class="bottom">
      <div class="role">ALUMNO</div>
      <div class="barcode">
        <img src="assets/barcode.jpg" alt="Código de barras">
      </div>
    </div>
  </div>
</body>
</html>
