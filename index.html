<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta de Identificación con Barra Escáner</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f4f4f4;
  }

  .card {
    width: 300px;
    border-radius: 30px;
    background-color: white;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    padding: 25px 0 30px;
  }

  .logo {
    margin-bottom: 15px;
  }

  .logo img {
    width: 70px;
  }

  .name-section {
    background-color: #b8d432;
    color: #e0670f;
    padding: 12px 15px;
    margin-bottom: 25px;
  }

  .name-section p {
    margin: 4px 0;
    font-weight: bold;
    font-size: 16px;
    line-height: 1.2;
  }

  .name-section p.code {
    font-size: 26px;
    margin-top: 10px;
  }

  .photo {
    margin-bottom: 15px;
  }

  .photo img {
    width: 160px;
    height: 184px;
    object-fit: cover;
    border-radius: 6px;
  }

  .role {
    color: #e0670f;
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 20px;
  }

  .barcode {
    padding: 0 20px;
  }

  .barcode img {
    width: 100%;
  }

  /* Barra Escáner */
  .barra-escaner {
    width: 100%;
    height: 14px;
    background: linear-gradient(to bottom, #f79052, #d9791e);
    position: absolute;
    top: 0;
    left: 0;
    z-index: 9999;
    animation: escanear 3.2s linear infinite;
  }

  @keyframes escanear {
    0% {
      top: 0;
    }
    50% {
      top: 100%;
    }
    100% {
      top: 0;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="barra-escaner"></div>
    <div class="logo">
      <img src="assets/logo.jpg" alt="Logo Universidad de Lima">
    </div>
    <div class="name-section">
      <p>FACUNDO DAVILA ANDY</p>
      <p>SAHID HEBER</p>
      <p class="code">20224753</p>
    </div>
    <div class="photo">
      <img src="assets/photo.jpg" alt="Foto del alumno">
    </div>
    <div class="role">ALUMNO</div>
    <div class="barcode">
      <img src="assets/barcode.jpg" alt="Código de barras">
    </div>
  </div>
</body>
</html>
