<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarjeta de Identificación con Barra Escáner</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: white;
  }

  .card {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background-color: white;
    text-align: center;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  .top {
    width: 100%;
  }

  .logo {
    padding: 30px 0 20px;
  }

  .logo img {
    width: 90px;
  }

  .name-section {
    background-color: #b8d432;
    color: #e0670f;
    padding: 22px 20px;
    width: 100%;
  }

  .name-section p {
    margin: 6px 0;
    font-weight: bold;
    font-size: 22px;
    line-height: 1.2;
  }

  .name-section p.code {
    font-size: 34px;
    margin-top: 14px;
  }

  .photo {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
  }

  .photo img {
    width: 62vw;
    max-width: 300px;
    height: auto;
    border-radius: 8px;
  }

  .bottom {
    width: 100%;
    padding-bottom: 30px;
  }

  .role {
    color: #e0670f;
    font-weight: bold;
    font-size: 26px;
    margin-bottom: 24px;
  }

  .barcode {
    padding: 0 30px;
  }

  .barcode img {
    width: 100%;
    max-width: 500px;
  }

  /* Barra Escáner */
  .barra-escaner {
    width: 100%;
    height: 14px;
    background: linear-gradient(to bottom, #f79052, #d9791e);
    position: absolute;
    top: 0;
    left: 0;
    z-index: 9999;
    animation: escanear 2.9s linear infinite;
  }

  @keyframes escanear {
    0% {
      top: 0;
    }
    50% {
      top: 100%;
    }
    100% {
      top: 0;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="barra-escaner"></div>
    <div class="top">
      <div class="logo">
        <img src="assets/logo.jpg" alt="Logo Universidad de Lima">
      </div>
      <div class="name-section">
        <p>FACUNDO DAVILA ANDY</p>
        <p>SAHID HEBER</p>
        <p class="code">20224753</p>
      </div>
    </div>
    <div class="photo">
      <img src="assets/photo.jpg" alt="Foto del alumno">
    </div>
    <div class="bottom">
      <div class="role">ALUMNO</div>
      <div class="barcode">
        <img src="assets/barcode.jpg" alt="Código de barras">
      </div>
    </div>
  </div>
</body>
</html>
